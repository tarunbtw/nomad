[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dino-browser"
version = "0.43.0"
description = "Official Python SDK for Dino - the ultra-light native macOS agentic browser engine"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Dino Team"}
]
keywords = ["dino", "dino-browser", "browser", "agent", "agentic", "webkit", "macos", "playwright", "puppeteer", "ai"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS :: MacOS X",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

[project.urls]
Homepage = "https://github.com/tarunbtw/dino"
